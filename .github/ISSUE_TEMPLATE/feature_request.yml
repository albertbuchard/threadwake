name: Feature proposal
description: Propose one bounded improvement to the workgraph, plugin, or public package.
title: "Proposal: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. Use fictional examples and do not include private conversations, workplace records, credentials, or live Forge data.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and who needs a better outcome?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Proposed surface
      options:
        - Workgraph contract
        - Graph
        - Kanban
        - List
        - Inspector, history, or evidence
        - Codex skill or plugin package
        - MCP server
        - Forge adapter
        - Theme or accessibility
        - Documentation or evaluation
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and what remains unchanged.
    validations:
      required: true
  - type: textarea
    id: canonical_state
    attributes:
      label: Canonical-state effect
      description: State whether this is view-only, read-only, a preview, or a material write. Explain how stable identity is preserved.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and privacy boundary
      description: Name data sources, network access, credentials, confirmation, and possible side effects.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Deterministic synthetic example
      description: Show the input and expected result using fictional identifiers and data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What smallest test or observation would establish that the proposal works safely?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing proposal that covers the same need.
          required: true
        - label: The example is synthetic and contains no private or sensitive work data.
          required: true
        - label: I have not presented a planned capability as already implemented.
          required: true
