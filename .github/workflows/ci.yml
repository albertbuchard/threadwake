name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-package:
    name: Verify application, contracts, MCP, plugin, and public package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and run checksum-verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set by GitHub Actions}"
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_directory="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          binary="${install_directory}/gitleaks"
          install -d -m 0700 "$install_directory"
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --retry 3 \
            --retry-delay 1 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar \
            --extract \
            --gzip \
            --file="$archive" \
            --directory="$install_directory" \
            --no-same-owner \
            --no-same-permissions \
            gitleaks
          test -x "$binary"
          test "$("$binary" version)" = "$GITLEAKS_VERSION"
          "$binary" dir --redact --no-banner --no-color .

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install and verify the pinned npm version
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.12.1
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "11.12.1"

      - name: Run the repository-owned preinstall validation directly
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/public-package/validate.test.mjs
          node scripts/public-package/validate.mjs

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run the full current-package check
        run: npm run check

      - name: Audit production and complete dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Verify reproducible bundles and notices
        shell: bash
        run: |
          set -euo pipefail
          cmp packages/mcp-server/dist/threadwake-mcp.mjs plugins/threadwake/server/threadwake-mcp.mjs
          test -s plugins/threadwake/server/THIRD_PARTY_NOTICES.txt
          git diff --exit-code -- \
            plugins/threadwake/server/threadwake-mcp.mjs \
            plugins/threadwake/server/THIRD_PARTY_NOTICES.txt

      - name: Check repository whitespace
        shell: bash
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD --

      - name: Verify the complete tracked worktree remains unchanged
        run: git diff --exit-code -- .
